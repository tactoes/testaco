name: Close stale issues

on:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/stale@v4
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. If you still need help, please comment and the issue will be reopened."
          days-before-stale: 60
          days-before-close: 14
          operations-per-run: 30
