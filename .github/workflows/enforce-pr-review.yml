name: Enforce PR Review for External Contributors

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-external-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check if PR is from external contributor
        id: check-external
        run: |
          # PR from repository owner (geirhe) - internal
          if [ "${{ github.event.pull_request.user.login }}" == "geirhe" ]; then
            echo "pr-type=internal" >> $GITHUB_OUTPUT
          else
            echo "pr-type=external" >> $GITHUB_OUTPUT
          fi

      - name: Enforce review requirement for external PRs
        if: steps.check-external.outputs.pr-type == 'external'
        uses: actions/github-script@v7
        with:
          script: |
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            const approvals = reviews.data.filter(r => r.state === 'APPROVED');
            const rejections = reviews.data.filter(r => r.state === 'CHANGES_REQUESTED');
            
            if (rejections.length > 0) {
              core.setFailed('PR has requested changes. Please address feedback.');
            }
            
            if (approvals.length === 0) {
              console.log('⚠️ External PR - awaiting maintainer review');
            } else {
              console.log('✅ External PR reviewed and approved');
            }
