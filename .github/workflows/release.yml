name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3a9c3cb6018206deb72da68a0fd7b2be5a49f8f8 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@0ab4596768b603586c0de567f2430c30f5b0d2b0 # v5
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Import GPG key (if provided)
        if: secrets.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -e
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: ./gradlew --no-search-upward --no-daemon clean build

      - name: Publish to Sonatype OSSRH (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
        run: |
          set -e
          # Import GPG key if not already imported in previous step
          if [ -n "${GPG_PASSPHRASE}" ] && ! gpg --list-secret-keys | grep -qF "$GPG_KEY_ID"; then
            echo "GPG key missing locally; ensure GPG_PRIVATE_KEY secret is set."
          fi
          # Publish using Gradle - project must be configured with maven-publish and nexus publishing
          ./gradlew --no-search-upward --no-daemon publish closeAndReleaseRepository \
            -PsonatypeUsername="$OSSRH_USERNAME" \
            -PsonatypePassword="$OSSRH_PASSWORD" \
            -Psigning.keyId="$GPG_KEY_ID" \
            -Psigning.password="$GPG_PASSPHRASE"

      - name: Create GitHub Release (attach artifacts)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@2c591bfe18eed4e37cbf9477c724f14eba5371fa # v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            build/libs/*.jar
            build/libs/*-sources.jar
            build/libs/*-javadoc.jar

      - name: Notify
        run: echo "Release workflow completed for ${{ github.ref_name }}"
