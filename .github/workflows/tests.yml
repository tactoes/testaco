name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testaco_test
          POSTGRES_USER: testaco
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'testaco_pass' }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-parallel
        env:
          TESTACO_DB_HOST: localhost
          TESTACO_DB_PORT: 5432
          TESTACO_DB_NAME: testaco_test
          TESTACO_DB_USER: testaco
          TESTACO_DB_PASSWORD: testaco_pass

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/test-results/**/*.xml
          github_token: ${{ secrets.GITHUB_TOKEN }}
