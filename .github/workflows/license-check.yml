name: License check

on: [pull_request]

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3a9c3cb6018206deb72da68a0fd7b2be5a49f8f8 # v4
      - name: Check Kotlin files for Apache header
        run: |
          set -e
          missing=""
          for f in $(git ls-files '*.kt'); do
            if ! grep -q "Licensed under the Apache License" "$f"; then
              missing="$missing\n$f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "❌ Missing Apache License header in:$missing"
            exit 1
          fi
          echo "✅ All Kotlin files have Apache License header"
