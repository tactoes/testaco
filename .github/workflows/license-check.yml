      - uses: actions/checkout@v4
      - name: Check Kotlin files for Apache header
        run: |
          set -e
          missing=""
          for f in $(git ls-files '*.kt'); do
            if ! grep -q "Licensed under the Apache License" "$f"; then
              missing="$missing\n$f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "❌ Missing Apache License header in:$missing"
            exit 1
          fi
          echo "✅ All Kotlin files have Apache License header"
