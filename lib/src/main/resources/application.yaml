spring:
  application.name: cruncher
  datasource:
    jdbc-url: jdbc:postgresql:15.3:///test?currentSchema=test
    username: test
    password: test
    hikari:
      auto-commit: false
  flyway:
    locations: classpath:/db/migrations
    validate-migration-naming: true
    default-schema: test
server:
  port: 9000
logging:
  config: classpath:logback.xml
